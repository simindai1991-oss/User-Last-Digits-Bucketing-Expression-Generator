<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Validator Pro</title>
    <style>
        :root {
            --primary-color: #27B26E; 
            --primary-dark: #1e8e56;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333;
            --danger-color: #ff4d4f;
            --success-bg: #f6ffed;
            --success-border: #b7eb8f;
            --error-bg: #fff2f0;
            --error-border: #ffccc7;
            --lab-color: #722ed1;
        }

        body {
            /* 调整字体，首选微软雅黑 */
            font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            width: 800px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 30px rgba(0,0,0,0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
            position: relative;
        }

        h2 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
        }

        .desc {
            font-size: 14px;
            color: #888;
        }

        /* Lab Toggle */
        .lab-toggle-container {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 12px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        .lab-toggle-container input {
            cursor: pointer;
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end; /* 让底部对齐 */
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .lab-input {
            display: none;
            border-left: 3px solid var(--lab-color);
            padding-left: 10px;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #555;
            text-transform: uppercase;
        }

        .lab-label {
            color: var(--lab-color);
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            height: 48px; /* 统一高度 */
            padding: 0 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 18px;
            font-family: "Microsoft YaHei", 'Courier New', monospace;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        
        .lab-input input:focus {
            border-color: var(--lab-color);
        }

        button.generate-btn {
            flex: 1.2; /* 按钮略宽一点点 */
            height: 48px; /* 与输入框高度一致 */
            padding: 0 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(39, 178, 110, 0.3);
            transition: transform 0.1s, background-color 0.2s;
            margin-bottom: 0; /* 移除额外间距 */
            font-family: "Microsoft YaHei", sans-serif;
        }
        
        .btn-lab-mode {
            background-color: var(--lab-color) !important;
            box-shadow: 0 4px 10px rgba(114, 46, 209, 0.3) !important;
        }

        button.generate-btn:active {
            transform: scale(0.98);
        }

        /* Regex Result */
        .result-section {
            background: #2d3436;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            position: relative;
            margin-bottom: 30px;
        }
        
        .code-box-title {
            font-size:12px; 
            color:#aaa; 
            margin-bottom:5px;
            display: flex;
            justify-content: space-between;
        }

        .regex-display {
            font-family: "Microsoft YaHei", 'Courier New', monospace;
            font-size: 16px;
            word-break: break-all;
            line-height: 1.4;
            color: #55efc4;
            max-height: 150px;
            overflow-y: auto;
        }

        .copy-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* SQL Details Section */
        details summary {
            cursor: pointer;
            font-size: 12px;
            color: #888;
            outline: none;
            user-select: none;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #555;
            transition: color 0.2s;
        }
        details summary:hover {
            color: #bbb;
        }
        
        .sql-container {
            position: relative;
            margin-top: 10px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 6px;
        }
        
        .sql-display {
            font-family: "Microsoft YaHei", 'Courier New', monospace;
            font-size: 14px;
            color: #f39c12; /* SQL专属橙色 */
            margin: 0;
            padding-right: 50px;
            line-height: 1.6;
            word-break: break-word;
        }
        
        .sql-copy-btn {
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.1);
        }

        /* Test Zone */
        .test-zone {
            border-top: 2px dashed #eee;
            padding-top: 25px;
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .refresh-btn {
            background-color: #f0f2f5;
            color: #555;
            border: 1px solid #d9d9d9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-badge {
            font-size: 13px;
            background: #e6f7ff;
            color: #096dd9;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        /* Grid */
        .test-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .test-card {
            padding: 10px;
            border-radius: 6px;
            font-family: "Microsoft YaHei", 'Courier New', monospace;
            font-size: 14px;
            text-align: center;
            border: 1px solid transparent;
            position: relative;
            background: #fff;
        }

        .match { background-color: var(--success-bg); border-color: var(--success-border); color: #135200; }
        .no-match { background-color: var(--error-bg); border-color: var(--error-border); color: #a8071a; opacity: 0.7; }
        .highlight { font-weight: 900; text-decoration: underline; }
        
        .mapped-info {
            display: block;
            font-size: 11px;
            color: var(--lab-color);
            margin-top: 4px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<!-- STREAMING_CHUNK:Rendering main container... -->
<div class="container">
    <div class="header">
        <h2>规则生成器 & 验证实验室</h2>
        <div class="desc">针对 16位 UserID，自动生成“倒数3、4位”范围正则并批量验证</div>
        
        <label class="lab-toggle-container">
            <input type="checkbox" id="labToggle" onchange="toggleLabMode()"> 🧪 启用高级实验分桶
        </label>
    </div>

    <div class="control-panel">
        <div class="input-group">
            <label>起始范围 (0-99)</label>
            <input type="number" id="startRange" min="0" max="99" value="0" placeholder="00">
        </div>
        <div class="input-group">
            <label>结束范围 (0-99)</label>
            <input type="number" id="endRange" min="0" max="99" value="19" placeholder="19">
        </div>
        <div class="input-group lab-input" id="seedGroup">
            <label class="lab-label">随机种子 (Seed)</label>
            <input type="text" id="hashSeed" placeholder="e.g. EXP_AUTOSAVE" value="EXP_AUTOSAVE">
        </div>
        <button class="generate-btn" id="genBtn" onclick="runTool()">⚡ 生成并验证</button>
    </div>
    
    <div class="result-section" id="resultBox" style="display:none;">
        <div class="code-box-title">
            <span>REGEX PATTERN <span id="regexLabBadge" style="display:none; color: #aaa; font-weight:normal;">(离散映射)</span></span>
        </div>
        <div class="regex-display" id="regexOutput"></div>
        <button class="copy-btn" onclick="copyText('regexOutput')">复制</button>
        
        <!-- SQL Section for Lab Mode -->
        <details id="sqlDetails" style="display:none;">
            <summary>SQL 映射表达式 (BI分析专用) ...</summary>
            <div class="sql-container">
                <div class="sql-display" id="sqlOutput"></div>
                <button class="copy-btn sql-copy-btn" onclick="copyText('sqlOutput')">复制</button>
            </div>
        </details>
    </div>

    <!-- STREAMING_CHUNK:Rendering test zone... -->
    <div class="test-zone">
        <div class="test-header">
            <span>🧪 <b>30组随机数据验证</b></span>
            <div>
                <span id="statsDisplay" class="stats-badge" style="display:none;">匹配: 0 / 30</span>
                <button class="refresh-btn" onclick="runTool()">🔄 换一批数据</button>
            </div>
        </div>
        <div class="test-grid" id="testGrid">
            <div style="grid-column: 1/-1; text-align: center; color: #999; padding: 20px;">
                正在加载测试数据...
            </div>
        </div>
    </div>
</div>

<script>
    // /* STREAMING_CHUNK:Defining core logic and functions... */
    
    // === Lab Mode Toggle ===
    let isLabMode = false;
    function toggleLabMode() {
        const toggle = document.getElementById('labToggle');
        const seedGroup = document.getElementById('seedGroup');
        const genBtn = document.getElementById('genBtn');
        const sqlDetails = document.getElementById('sqlDetails');
        
        isLabMode = toggle.checked;
        
        if (isLabMode) {
            seedGroup.style.display = 'block';
            genBtn.classList.add('btn-lab-mode');
            genBtn.innerText = '🧪 生成哈希映射正则并验证';
        } else {
            seedGroup.style.display = 'none';
            // document.getElementById('hashSeed').value = ''; // We keep the value so user doesn't lose it if toggling back and forth
            genBtn.classList.remove('btn-lab-mode');
            genBtn.innerText = '⚡ 生成并验证';
            sqlDetails.style.display = 'none'; // Hide SQL details
        }
        
        // Refresh the results automatically when mode is toggled
        runTool();
    }

    // === Seeded Pseudo-Random Number Generator (PRNG) ===
    function cyrb128(str) {
        let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
        for (let i = 0, k; i < str.length; i++) {
            k = str.charCodeAt(i);
            h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
            h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
            h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
            h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
        }
        h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
        h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
        h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
        h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
        h1 ^= (h2 ^ h3 ^ h4), h2 ^= h1, h3 ^= h1, h4 ^= h1;
        return [h1>>>0, h2>>>0, h3>>>0, h4>>>0];
    }
    
    function mulberry32(a) {
        return function() {
          var t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }

    // /* STREAMING_CHUNK:Generating mappings and regex... */
    
    // === Hash Mapping Logic ===
    function generateMappingTable(seedStr) {
        let arr = Array.from({length: 100}, (_, i) => i);
        let seed = cyrb128(seedStr || "default")[0];
        let rand = mulberry32(seed);
        
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(rand() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // === Regex Generators ===
    function generateContinuousRegex(start, end) {
        let parts = [];
        let current = start;

        function rangeStr(a, b) {
            if (a === b) return `${a}`;
            if (a === 0 && b === 9) return `\\d`;
            return `[${a}-${b}]`;
        }

        if (current % 10 !== 0) {
            let headEnd = Math.min(end, Math.floor(current / 10) * 10 + 9);
            let ten = Math.floor(current / 10);
            let low = current % 10;
            let high = headEnd % 10;
            if (low === high) parts.push(`${ten}${low}`);
            else parts.push(`${ten}${rangeStr(low, high)}`);
            current = headEnd + 1;
        }

        let bodyTenStart = Math.floor(current / 10);
        let bodyTenEnd = (end + 1) % 10 === 0 ? Math.floor(end / 10) : Math.floor(end / 10) - 1;

        if (bodyTenStart <= bodyTenEnd) {
            if (bodyTenStart === 0 && bodyTenEnd === 9) parts.push(`\\d\\d`);
            else if (bodyTenStart === bodyTenEnd) parts.push(`${bodyTenStart}\\d`);
            else parts.push(`${rangeStr(bodyTenStart, bodyTenEnd)}\\d`);
            current = (bodyTenEnd + 1) * 10;
        }

        if (current <= end) {
            let ten = Math.floor(current / 10);
            let high = end % 10;
            if (high === 0) parts.push(`${ten}0`); 
            else parts.push(`${ten}${rangeStr(0, high)}`);
        }

        let innerPattern = parts.join('|');
        if (parts.length > 1) innerPattern = `(${innerPattern})`;
        
        return `\\d*${innerPattern}\\d{2}$`;
    }

    function generateDiscreteRegex(start, end, seedStr) {
        const mapTable = generateMappingTable(seedStr);
        let mappedTargets = [];
        for (let i = start; i <= end; i++) {
            mappedTargets.push(mapTable[i]);
        }
        
        mappedTargets = mappedTargets.map(n => n.toString().padStart(2, '0')).sort();
        let innerPattern = mappedTargets.join('|');
        return `\\d*(${innerPattern})\\d{2}$`;
    }

    function generateRandomId(length) {
        let result = '';
        for (let i = 0; i < length; i++) result += Math.floor(Math.random() * 10);
        return result;
    }

    // /* STREAMING_CHUNK:Executing tool and populating UI... */
    
    function runTool() {
        const start = parseInt(document.getElementById('startRange').value);
        const end = parseInt(document.getElementById('endRange').value);
        const seedStr = document.getElementById('hashSeed').value.trim();

        if (isNaN(start) || isNaN(end) || start > end || start < 0 || end > 99) {
            alert("请检查范围输入 (0-99, Start <= End)");
            return;
        }

        let regexStr = "";
        let mapTable = null;

        // A. 生成正则与SQL
        if (isLabMode && seedStr) {
            regexStr = generateDiscreteRegex(start, end, seedStr);
            mapTable = generateMappingTable(seedStr);
            document.getElementById('regexLabBadge').style.display = 'inline';
            
            // 构建 SQL 表达式
            let mappedTargets = [];
            for (let i = start; i <= end; i++) {
                mappedTargets.push(mapTable[i].toString().padStart(2, '0'));
            }
            mappedTargets.sort();
            const sqlStr = `SUBSTR(user_id, -4, 2) IN ('${mappedTargets.join("', '")}')`;
            
            document.getElementById('sqlOutput').innerText = sqlStr;
            document.getElementById('sqlDetails').style.display = 'block';
            
        } else {
            regexStr = generateContinuousRegex(start, end);
            document.getElementById('regexLabBadge').style.display = 'none';
            document.getElementById('sqlDetails').style.display = 'none';
            // We do not force close the detail panel so if user had it open it stays.
            // If we wanted to force close: document.getElementById('sqlDetails').removeAttribute('open');
        }

        const regexObj = new RegExp(regexStr);
        document.getElementById('regexOutput').innerText = regexStr;
        document.getElementById('resultBox').style.display = 'block';

        // B. 生成测试数据并验证
        const grid = document.getElementById('testGrid');
        grid.innerHTML = '';
        let matchCount = 0;

        for (let i = 0; i < 30; i++) {
            let id = "";
            let targetTail = "";
            
            if (i < 12) {
                let rawVal = Math.floor(Math.random() * (end - start + 1)) + start;
                if (isLabMode && seedStr) {
                    targetTail = mapTable[rawVal].toString().padStart(2, '0');
                } else {
                    targetTail = rawVal.toString().padStart(2, '0');
                }
            } else {
                targetTail = Math.floor(Math.random() * 100).toString().padStart(2, '0');
            }

            id = generateRandomId(12) + targetTail + generateRandomId(2);

            const isMatch = regexObj.test(id);
            if (isMatch) matchCount++;

            const prefix = id.substring(0, 12);
            const target = id.substring(12, 14);
            const suffix = id.substring(14, 16);

            const card = document.createElement('div');
            card.className = `test-card ${isMatch ? 'match' : 'no-match'}`;
            
            let cardHtml = `${prefix}<span class="highlight">${target}</span>${suffix}`;
            
            if (isLabMode && seedStr) {
                let originalIndex = mapTable.indexOf(parseInt(target));
                // Show the original tail for BOTH matched and unmatched cases in lab mode
                cardHtml += `<span class="mapped-info">← 来自原始尾号: ${originalIndex.toString().padStart(2, '0')}</span>`; 
            }
            
            card.innerHTML = cardHtml;
            grid.appendChild(card);
        }

        document.getElementById('statsDisplay').style.display = 'inline-block';
        document.getElementById('statsDisplay').innerText = `匹配成功: ${matchCount} / 30`;
    }

    function copyText(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = '已复制!';
            setTimeout(() => { btn.innerText = originalText; }, 1500);
        });
    }

    // Trigger calculation automatically on page load
    window.onload = function() {
        runTool();
    };
</script>

</body>
</html>
